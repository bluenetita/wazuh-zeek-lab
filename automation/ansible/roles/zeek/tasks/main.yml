---
- name: Install Zeek runtime dependencies
  ansible.builtin.apt:
    name: "{{ zeek_runtime_packages }}"
    state: present
    update_cache: true

- name: Check current Zeek version
  ansible.builtin.command:
    cmd: /opt/zeek/bin/zeek --version
  register: zeek_current_version
  changed_when: false
  failed_when: false

- name: Remove a different Zeek installation
  ansible.builtin.file:
    path: "{{ zeek_prefix }}"
    state: absent
  when:
    - zeek_current_version.rc == 0
    - ("zeek version " ~ zeek_version) not in zeek_current_version.stdout

- name: Install precompiled Zeek artifact
  ansible.builtin.unarchive:
    src: "{{ zeek_artifact }}"
    dest: /
  when: >-
    zeek_current_version.rc != 0 or
    ("zeek version " ~ zeek_version) not in zeek_current_version.stdout

- name: Create Zeek group
  ansible.builtin.group:
    name: zeek
    system: true
    state: present

- name: Create Zeek service user
  ansible.builtin.user:
    name: zeek
    group: zeek
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Add Zeek to the system PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/zeek.sh
    content: |
      export PATH="/opt/zeek/bin:$PATH"
    owner: root
    group: root
    mode: "0644"

- name: Add Zeek to sudo secure_path
  ansible.builtin.copy:
    dest: /etc/sudoers.d/zeek-path
    content: |
      Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/zeek/bin"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Configure Zeek capture Netplan
  ansible.builtin.template:
    src: 60-zeek-capture.yaml.j2
    dest: /etc/netplan/60-zeek-capture.yaml
    owner: root
    group: root
    mode: "0600"
  register: zeek_netplan

- name: Validate Netplan configuration
  ansible.builtin.command:
    cmd: netplan generate
  changed_when: false
  when: zeek_netplan.changed

- name: Apply Netplan configuration
  ansible.builtin.command:
    cmd: netplan apply
  when: zeek_netplan.changed

- name: Configure Zeek node
  ansible.builtin.template:
    src: node.cfg.j2
    dest: /opt/zeek/etc/node.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart Zeek

- name: Install ZeekControl configuration from repository snapshot
  ansible.builtin.copy:
    src: etc/zeekctl.cfg
    dest: /opt/zeek/etc/zeekctl.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart Zeek

- name: Install Zeek networks configuration from repository snapshot
  ansible.builtin.copy:
    src: etc/networks.cfg
    dest: /opt/zeek/etc/networks.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart Zeek

- name: Install local.zeek from repository snapshot
  ansible.builtin.copy:
    src: site/local.zeek
    dest: /opt/zeek/share/zeek/site/local.zeek
    owner: root
    group: root
    mode: "0644"
  notify: Restart Zeek

- name: Install Zeek custom scripts
  ansible.builtin.copy:
    src: site/custom_scripts/
    dest: /opt/zeek/share/zeek/site/custom_scripts/
    owner: root
    group: root
    directory_mode: "0755"
  notify: Restart Zeek

- name: Make Wazuh-Zeek helper executable
  ansible.builtin.file:
    path: /opt/zeek/share/zeek/site/custom_scripts/wazuh-zeek.sh
    state: file
    owner: root
    group: root
    mode: "0755"

- name: Create custom Zeek log directory
  ansible.builtin.file:
    path: "{{ zeek_custom_log_dir }}"
    state: directory
    owner: zeek
    group: zeek
    mode: "0755"

- name: Install Zeek custom logrotate policy
  ansible.builtin.copy:
    src: logrotate/zeek-custom
    dest: /etc/logrotate.d/zeek-custom
    owner: root
    group: root
    mode: "0644"

- name: Check installed Zeek packages
  ansible.builtin.command:
    cmd: /opt/zeek/bin/zkg list
  register: zkg_packages
  changed_when: false

- name: Install bro-simple-scan
  ansible.builtin.command:
    cmd: /opt/zeek/bin/zkg install --force ncsa/bro-simple-scan
  when: "'bro-simple-scan' not in zkg_packages.stdout"
  notify: Restart Zeek

- name: Check Zeek capabilities
  ansible.builtin.command:
    cmd: getcap /opt/zeek/bin/zeek
  register: zeek_capabilities
  changed_when: false

- name: Set packet-capture capabilities on Zeek
  ansible.builtin.command:
    cmd: setcap cap_net_raw,cap_net_admin=eip /opt/zeek/bin/zeek
  when: >-
    'cap_net_admin,cap_net_raw=eip' not in zeek_capabilities.stdout and
    'cap_net_raw,cap_net_admin=eip' not in zeek_capabilities.stdout

- name: Install bridge promiscuous-mode service
  ansible.builtin.template:
    src: bridge-promisc.service.j2
    dest: /etc/systemd/system/bridge-promisc.service
    owner: root
    group: root
    mode: "0644"
  register: bridge_promisc_unit

- name: Install VLAN promiscuous-mode service
  ansible.builtin.template:
    src: vlan-promisc.service.j2
    dest: /etc/systemd/system/vlan-promisc.service
    owner: root
    group: root
    mode: "0644"
  register: vlan_promisc_unit

- name: Install Zeek systemd service
  ansible.builtin.template:
    src: zeek.service.j2
    dest: /etc/systemd/system/zeek.service
    owner: root
    group: root
    mode: "0644"
  register: zeek_unit
  notify: Restart Zeek

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: bridge_promisc_unit.changed or vlan_promisc_unit.changed or zeek_unit.changed

- name: Enable and start parent-interface promiscuous mode
  ansible.builtin.systemd_service:
    name: bridge-promisc.service
    enabled: true
    state: started

- name: Enable and start VLAN-interface promiscuous mode
  ansible.builtin.systemd_service:
    name: vlan-promisc.service
    enabled: true
    state: started

- name: Verify installed Zeek version
  ansible.builtin.command:
    cmd: /opt/zeek/bin/zeek --version
  register: zeek_version_result
  changed_when: false

- name: Assert Zeek version
  ansible.builtin.assert:
    that:
      - ("zeek version " ~ zeek_version) in zeek_version_result.stdout
    fail_msg: "Unexpected Zeek version: {{ zeek_version_result.stdout }}"
