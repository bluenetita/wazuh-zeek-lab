---
zeek_version: "8.0.6"
zeek_prefix: "/opt/zeek"
zeek_parent_interface: "ens19"
zeek_vlan_id: 999
zeek_capture_interface: "{{ zeek_parent_interface }}.{{ zeek_vlan_id }}"
zeek_custom_log_dir: "/var/log/zeek-custom"

# Runtime libraries required by the Ubuntu 24.04 amd64 build created in the lab.
zeek_runtime_packages:
  - libbsd0
  - libc6
  - libcap2
  - libcom-err2
  - libdbus-1-3
  - libgcc-s1
  - libgcrypt20
  - libgpg-error0
  - libgssapi-krb5-2
  - libibverbs1
  - libk5crypto3
  - libkeyutils1
  - libkrb5-3
  - libkrb5support0
  - liblz4-1
  - liblzma5
  - libmd0
  - libnl-3-200
  - libnl-route-3-200
  - libnorm1t64
  - libpcap0.8t64
  - libpgm-5.3-0t64
  - libsodium23
  - libssl3t64
  - libstdc++6
  - libsystemd0
  - libzmq5
  - libzstd1
  - zlib1g
  - libcap2-bin
  - logrotate
  - git
  - python3
  - python3-git
  - python3-semantic-version
